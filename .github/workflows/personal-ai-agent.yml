name: Personal AI Agent CI

on:
  push:
    branches: [main]
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent.yml"
  pull_request:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ai-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-ai-agent/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Next.js application
        run: npm run build
