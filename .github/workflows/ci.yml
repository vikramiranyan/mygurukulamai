name: Gurukulam AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test -- --reporter=verbose
      - name: Stage 8 regression suite
        run: npm run test:stage8
      - name: Production build
        run: npm run build
      - name: Stage 4 acceptance marker
        run: echo "Stage 4 CI verification passed"
