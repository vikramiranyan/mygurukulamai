name: Gurukulam AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test -- --reporter=verbose
      - name: Stage 8 regression suite
        run: npm run test:stage8
      - name: Production build
        run: npm run build
      - name: Stage 4 acceptance marker
        run: echo "Stage 4 CI verification passed"

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Backend security tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-gurukulam.db
          GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-hs256
          FRONTEND_ORIGINS: http://localhost:5173
          SECURE_HEADERS: 'true'
          ALLOWED_HOSTS: localhost
        run: pytest -q
