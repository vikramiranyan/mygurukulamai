name: Gurukulam Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run model/schema tests
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          GOOGLE_CLIENT_ID: ci-test-client
          JWT_SECRET: ci-test-secret-for-validation-only
          FRONTEND_ORIGINS: http://localhost:5173
          DRIVE_REGISTRY_HMAC_SECRET: ci-registry-secret
        run: PYTHONPATH=. pytest -q
